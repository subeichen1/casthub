name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies (locked)
        run: cd server && npm ci
      - name: Type check, lint and build
        run: cd server && npm run typecheck && npm run lint && npm run build
      - name: Dependency audit (production + dev)
        run: cd server && npm audit --audit-level=high
      - name: E2E (App casting)
        run: cd server && node scripts/e2e.mjs
      - name: E2E (DLNA fallback)
        run: cd server && node scripts/e2e-dlna.mjs
      - name: E2E (Playback history)
        run: cd server && node scripts/e2e-history.mjs
      - name: E2E (Subtitles)
        run: cd server && npm run e2e-subtitles
      - name: SBOM (CycloneDX)
        run: cd server && npm sbom --sbom-format=cyclonedx > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: casthub-server-sbom
          path: server/sbom.json
          retention-days: 30

  android:
    name: Android TV (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd tv-app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: casthub-tv-debug
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
